name: CPU Checks
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install torch==2.5.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt
      - run: python prepare_references.py --smoke
      - run: python run_case.py --case all --smoke --threads 2
      - run: python validate_release.py --smoke-results
      - run: python -m pytest -q
